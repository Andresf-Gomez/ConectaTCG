name: build-image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: conecta-production-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige minúsculas: el repo es ConectaTCG, la imagen es conectatcg.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/andresf-gomez/conectatcg
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main

      # Solo build + push por ahora; el deploy vía API de Coolify se añade
      # tras validar la primera imagen (mismo proceso seguido con Drew).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
